@let r = resultado();
<div class="overlay" (click)="fechado.emit()">
  <div
    class="popup popup-centro"
    role="dialog"
    aria-modal="true"
    aria-labelledby="titulo-peso"
    (click)="$event.stopPropagation()"
  >
    <h3 id="titulo-peso">Peso ideal</h3>
    <p class="nome">{{ r.nome }}</p>
    <div class="peso-ideal">{{ r.peso_ideal | number: '1.2-2' }} <small>kg</small></div>
    <dl>
      <dt>Sexo</dt>
      <dd>{{ r.sexo === 'M' ? 'Masculino' : 'Feminino' }}</dd>
      <dt>Altura</dt>
      <dd>{{ r.altura | number: '1.2-2' }} m</dd>
      <dt>Peso atual</dt>
      <dd>{{ r.peso | number: '1.1-2' }} kg</dd>
      <dt>Diferença</dt>
      <dd>{{ r.peso - r.peso_ideal | number: '1.2-2' }} kg</dd>
    </dl>
    <button type="button" class="btn btn-primario" (click)="fechado.emit()">Fechar</button>
  </div>
</div>
